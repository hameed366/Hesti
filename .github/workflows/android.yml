name: بناء تطبيق أندرويد (APK)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: بناء ملفات التطبيق (مع الخطوط والمكتبات المحلية)
        run: node scripts/build.mjs --vendor
      - name: إنشاء مشروع أندرويد
        run: npx cap add android
      - name: توليد الأيقونة وشاشة البداية
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#2159c4' --iconBackgroundColorDark '#16243f'
          --splashBackgroundColor '#f4f6f9' --splashBackgroundColorDark '#0f1522'
      - run: npx cap sync android
      - name: بناء APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hessati-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
