<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2159c4">
<meta name="application-name" content="حصتي">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حصتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>حصتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: navigation rail on the right (start side), work area on the left; lessons read as section cards, presenter mode shows one section at a time full screen. */
:root{
  --ink:#16243f;          /* navy text and chrome */
  --paper:#f3f5f9;        /* page background */
  --card:#ffffff;
  --line:#dde3ee;
  --muted:#5f6b82;
  --accent:#2159c4;       /* blue */
  --gold:#c99a35;         /* brand gold */
  --good:#1f8a4c;
  --chalk:#1f3a33;
  --accent-soft:#e7eefc;
  --font-ui:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-book:"Noto Naskh Arabic", "Traditional Arabic", serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6ebf5;--paper:#0f1522;--card:#182133;--line:#2a364d;--muted:#9aa6bd;
    --accent:#6f9bf0;--gold:#e0b65a;--good:#4cc283;--accent-soft:#1d2c4a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6ebf5;--paper:#0f1522;--card:#182133;--line:#2a364d;--muted:#9aa6bd;
  --accent:#6f9bf0;--gold:#e0b65a;--good:#4cc283;--accent-soft:#1d2c4a;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
img{max-width:100%}

.app{display:flex;height:100%}
.rail{width:92px;flex:none;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:stretch;padding:14px 8px;gap:6px}
:root[data-theme="dark"] .rail{background:#0a0f19;color:#e6ebf5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rail{background:#0a0f19;color:#e6ebf5}}
.brand{font-family:var(--font-book);font-weight:700;font-size:26px;text-align:center;color:var(--gold);margin-bottom:10px}
.nav-btn{background:none;border:0;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:inherit;opacity:.72;font-size:13px}
.nav-btn svg{width:24px;height:24px}
.nav-btn[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12)}
.nav-btn[aria-current="page"] svg{color:var(--gold)}
.main{flex:1;min-width:0;overflow:auto}
.wrap{max-width:1100px;margin:0 auto;padding:22px 20px 90px}
@media (max-width:720px){
  .app{flex-direction:column-reverse}
  .rail{width:auto;flex-direction:row;padding:6px;justify-content:space-around}
  .brand{display:none}
  .nav-btn{flex:1;padding:6px 2px;font-size:12px}
  .wrap{padding:16px 16px 40px}
}

.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent)}
.title{font-size:26px;font-weight:700}
.sub{color:var(--muted)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1404}
.btn.ghost{background:none}
.btn svg{width:18px;height:18px}
.btn.small{padding:5px 10px;font-size:14px;border-radius:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* home */
.hero{background:var(--ink);color:var(--paper);border-radius:22px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
:root[data-theme="dark"] .hero{background:#1c2a46;color:#e6ebf5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{background:#1c2a46;color:#e6ebf5}}
.hero h1{font-family:var(--font-book);font-size:30px}
.hero p{margin:6px 0 0;opacity:.8}
.hero .stamp{font-family:var(--font-book);font-size:64px;color:var(--gold);line-height:1}
@media (max-width:600px){.hero{grid-template-columns:1fr}.hero .stamp{display:none}}
.section-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.section-h h2{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:right;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--accent)}
.tile .k{font-size:13px;color:var(--muted)}
.tile .t{font-weight:700;font-size:18px}
.tile .num{font-family:var(--font-book);font-size:34px;color:var(--gold);line-height:1}
.continue{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px;text-align:right;width:100%}

.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:right;width:100%}
.row:hover{border-color:var(--accent)}
.code{font-family:var(--font-book);font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .body{flex:1;min-width:0}
.row .obj{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.done-pill{font-size:12px;background:var(--good);color:#fff;border-radius:99px;padding:2px 10px;white-space:nowrap}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px}

/* lesson */
.lesson{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.toc{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;max-height:calc(100vh - 40px);overflow:auto}
.toc button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:right;padding:7px 8px;border-radius:10px;font-size:14px}
.toc button:hover{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
@media (max-width:900px){
  .lesson{grid-template-columns:1fr}
  .toc{position:static;display:flex;overflow-x:auto;max-height:none;padding:6px;gap:4px}
  .toc button{white-space:nowrap;width:auto}
}
.objective{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--gold);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.objective b{color:var(--gold)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.sec-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.kind{font-size:13px;font-weight:700;color:#fff;border-radius:99px;padding:2px 12px}
.sec-title{font-weight:700;font-size:17px}
.ref{color:var(--muted);font-size:13px}
.sec-body{padding:14px 16px}
.page-img{display:block;margin:0 auto;background:#fff;border-radius:8px;cursor:zoom-in}
.sol{margin-top:12px;border-top:2px dashed var(--good);padding-top:12px}
.sol-label{color:var(--good);font-weight:700;font-size:14px;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.loading{color:var(--muted);padding:30px;text-align:center}

/* book text */
.book{font-family:var(--font-book);font-size:19px;line-height:2}
.book .prompt{font-weight:600}
.book .note{background:var(--accent-soft);border-radius:10px;padding:6px 12px;margin:8px 0;font-size:17px}
.items{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;gap:10px;align-items:baseline}
.lbl{font-weight:700;color:var(--accent);min-width:1.6em}
.ans{color:var(--good);font-weight:600}
.ans::before{content:"← ";opacity:.6}
/* math */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 .15em;font-size:.9em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.rt{display:inline-flex;align-items:flex-start;white-space:nowrap}
.rt .rs{display:inline-block;transform:scaleX(-1);margin-left:-.05em}
.rt .rr{border-top:1.5px solid currentColor;padding:0 .12em;line-height:1.5;margin-top:.12em}
.ov{text-decoration:overline}
.ray{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.ray::before{content:"⟵";font-size:.75em;line-height:.8}
.set{font-weight:700}
.cset::after{content:"′"}
sup,sub{font-size:.62em;line-height:0}

/* modal + overlays */
.scrim{position:fixed;inset:0;background:rgba(8,12,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog{background:var(--card);border-radius:18px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dialog h3{margin-bottom:12px}
.dialog label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
textarea.field{min-height:150px;resize:vertical;line-height:1.7}
.dlg-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.zoom{position:fixed;inset:0;background:rgba(8,12,22,.9);z-index:60;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px}
.zoom img{background:#fff;border-radius:8px;max-width:none;width:min(1400px,96vw)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;z-index:90;font-size:15px}

/* presenter */
.pres{position:fixed;inset:0;background:var(--paper);z-index:40;display:flex;flex-direction:column}
.pres-top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.pres-stage{flex:1;position:relative;overflow:auto}
.pres-inner{max-width:1300px;margin:0 auto;padding:20px 24px 40px}
.pres-inner .book{font-size:clamp(20px,2.3vw,32px)}
.pres-inner .page-img.fit{width:100%;max-width:none;object-fit:contain;background:none;border-radius:0}
.pres-inner .sol .page-img{width:100%;max-width:1100px;height:auto}
.pres.focus .pres-top,.pres.focus .pres-bottom,.pres.focus .pres-inner>.sec-head{display:none}
.pres.focus .pres-inner{padding:8px;max-width:none}
.focus-ctl{display:none}
.pres.focus .focus-ctl{display:flex;position:fixed;z-index:8;gap:8px;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(22,36,63,.78);padding:6px;border-radius:16px;backdrop-filter:blur(6px)}
.focus-ctl button{background:none;border:0;color:#fff;border-radius:12px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-size:15px}
.focus-ctl button:hover{background:rgba(255,255,255,.15)}
.focus-ctl button[disabled]{opacity:.35}
.focus-ctl svg{width:22px;height:22px}
.pres.focus .focus-ctl{transition:opacity .3s}
.pres.focus.ctl-hidden .focus-ctl{opacity:0;pointer-events:none}
.pres.is-display .focus-ctl{display:none!important}
.link-badge{position:fixed;top:10px;left:10px;z-index:9;background:rgba(22,36,63,.85);color:#fff;border-radius:12px;padding:6px 12px;font-size:14px}
.link-badge.ok{opacity:.55}
.link-badge b{font-size:20px;letter-spacing:3px;color:var(--gold)}
.pres.is-remote .pres-stage{background:var(--accent-soft)}
.pres-bottom{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.progress{flex:1;display:flex;gap:4px;min-width:120px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--accent)}
.draw-layer{position:absolute;inset:0;touch-action:none;z-index:5}
.draw-tools{position:absolute;top:12px;left:12px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch[aria-pressed="true"]{border-color:var(--gold)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* timer widget */
.timer{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px 6px}
.timer .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:62px;text-align:center}
.timer.ending .clock{color:#d23c3c}
.timer.over{background:#d23c3c;color:#fff}
.big-clock{font-size:clamp(70px,16vw,190px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin:10px 0}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* classes */
.class-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.class-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.stu{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--paper)}
.stu .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.mini{border:0;background:none;padding:2px 6px;border-radius:8px;color:var(--muted)}
.mini:hover{background:var(--accent-soft);color:var(--ink)}
.picker-name{font-family:var(--font-book);font-size:clamp(40px,8vw,84px);font-weight:700;text-align:center;min-height:1.6em;color:var(--accent)}
.picker-name.final{color:var(--gold)}

/* board */
.board-wrap{display:flex;flex-direction:column;height:100%}
.board-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.board-area{flex:1;position:relative;min-height:300px}
.board-area canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* custom books + editor */
/* plan */
.wk-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;display:flex;flex-direction:column}
.wk-row{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wk-row:last-child{border-bottom:0}
@media (max-width:600px){.wk-row{flex-direction:column;gap:8px}.wk-g{flex-direction:row;align-items:center}}
.wk-g{display:flex;flex-direction:column;gap:4px;min-width:120px;align-items:flex-start}
.wk-items{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.wk-chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 10px;text-align:right;font-size:14px}
.wk-chip .code{padding:1px 7px;font-size:13px}
.wk-chip .sub{font-size:12px}
.wk-chip.done{border-color:var(--good);box-shadow:inset -4px 0 0 var(--good)}
.wk-chip:not([disabled]):hover{border-color:var(--accent)}
.plan-sum{display:flex;gap:18px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.plan-sum>div{flex:1;min-width:160px}
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.week.now{border:2px solid var(--accent);box-shadow:0 6px 20px rgba(33,89,196,.12)}
.week-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.note-pill{font-size:12px;background:#fde7d6;color:#9a3412;border-radius:99px;padding:2px 10px}
.pi{display:flex;gap:10px;align-items:center;padding:6px 4px;border-top:1px dashed var(--line)}
.pi input[type=checkbox]{width:18px;height:18px;accent-color:var(--good)}
.pi-t{flex:1;min-width:0;border:0;background:none;text-align:right;padding:0}
.pi-t:not([disabled]):hover{color:var(--accent)}
body:not(.can-dl) .dl-only{display:none}
.tile.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--accent);min-height:120px}
.tile.add .num{color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ed-sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;border-right:5px solid var(--k,#888)}
.ed-row{display:grid;grid-template-columns:170px 1fr 160px;gap:8px;align-items:end}
@media (max-width:700px){.ed-row{grid-template-columns:1fr}}
.ed-row label,.ed-grid label,.ed-text label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:700px){.ed-grid{grid-template-columns:1fr}}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.slot img{max-height:200px;object-fit:contain;background:#fff;border-radius:6px;align-self:center}
.slot .btns{display:flex;gap:6px;flex-wrap:wrap}
.ed-text{margin-top:10px}
.ed-text textarea{min-height:80px}
details.more>summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:10px}
.add-kinds{display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:12px}
.add-kinds b{width:100%;font-size:14px;color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted)}
/* cropper */
.crop{position:fixed;inset:0;background:#2a2f3a;z-index:70;display:flex;flex-direction:column}
.crop-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.crop-stage{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.crop-page{position:relative;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.4);user-select:none}
.crop-page.select{touch-action:none;cursor:crosshair}
.crop-page canvas{display:block;width:100%;height:100%}
.crop-sel{position:absolute;border:2px solid var(--gold);background:rgba(201,154,53,.18);box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.crop-hint{color:#cfd6e4;text-align:center;padding:6px;font-size:14px;background:#2a2f3a}
/* excel import */
.prev-table{overflow:auto;max-height:220px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.prev-table table{border-collapse:collapse;font-size:13px;width:100%}
.prev-table td,.prev-table th{border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap;text-align:right}
.prev-table th{background:var(--accent-soft);position:sticky;top:0}
.prev-table th.pick{background:var(--accent);color:#fff}

async function fileToImage(file,max=1500){

/* standalone mode (GitHub Pages / installed PWA / Capacitor app): no claude.ai runtime, so provide file saving ourselves and hide the phone-link feature */
if(!(window.claude&&window.claude.use)){
  document.body.classList.add("no-room","can-dl");
  DL={save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data],{type:"application/octet-stream"});
    const cap=window.Capacitor;
    if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){
      const FS=cap.Plugins&&cap.Plugins.Filesystem,SH=cap.Plugins&&cap.Plugins.Share;
      if(!FS||!SH)throw new Error("native file plugins missing");
      const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=no;r.readAsDataURL(blob);});
      const w=await FS.writeFile({path:filename,data:b64,directory:"CACHE"});
      try{await SH.share({title:filename,url:w.uri,dialogTitle:"حفظ الملف"});}
      catch(e){if(/cancel/i.test(String(e&&e.message||e)))throw {code:"declined"};throw e;}
      return;
    }
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  }};
}

  // plain radicals: √(…) or √token
  h=h.replace(/√\(([^()]*)\)/g,(m,a)=>rootHTML(a));
  h=h.replace(/√([0-9٠-٩٫.ء-ي]+)/g,(m,a)=>rootHTML(a));
  h=h.replace(/\[\[root:\|([^\]]*)\]\]/g,(m,a)=>rootHTML(a));
  h=h.replace(/\[\[mixed:([^|\]]*)\|([^|\]]*)\|([^\]]*)\]\]/g,(m,w,n,d)=>`${w}<span class="fr"><span>${n}</span><span>${d}</span></span>`);
  h=h.replace(/\[\[frac:([^|\]]*)\|([^\]]*)\]\]/g,(m,n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`);
  h=h.replace(/\[\[pow:([^|\]]*)\|([^\]]*)\]\]/g,(m,b,e)=>`${b}<sup>${e}</sup>`);
  h=h.replace(/\[\[sub:([^|\]]*)\|([^\]]*)\]\]/g,(m,b,e)=>`${b}<sub>${e}</sub>`);
  h=h.replace(/\[\[bar:([^\]]*)\]\]/g,(m,a)=>`<span class="ov">${a}</span>`);
  h=h.replace(/\[\[ray:([^\]]*)\]\]/g,(m,a)=>`<span class="ray">${a}</span>`);
  h=h.replace(/\[\[abs:([^\]]*)\]\]/g,(m,a)=>`|${a}|`);
  h=h.replace(/\[\[cset:([^\]]*)\]\]/g,(m,a)=>`<span class="set cset">${a}</span>`);
  h=h.replace(/\[\[set:([^\]]*)\]\]/g,(m,a)=>`<span class="set">${a}</span>`);
  h=h.replace(/\[\[[a-z]+:([^\]]*)\]\]/g,(m,a)=>a.replace(/\|/g," "));
  return h.replace(/\n/g,"<br>");
}

function go(r,push=true){
  route=r;
  let hash="";
  if(r.view==="lesson")hash=r.id;else if(r.view==="grade")hash=r.id;else if(r.view==="unit")hash=r.id;else if(r.view==="edit")hash="edit-"+r.id;else if(r.view!=="home")hash=r.view;
  if(push&&location.hash.slice(1)!==hash){suppressHash=true;location.hash=hash;}
  render();
}
let suppressHash=false;
function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h)return {view:"home"};
  if(["classes","board","tools","settings","plan"].includes(h))return {view:h};
  if(h.startsWith("edit-")&&LESSON[h.slice(5)]&&LESSON[h.slice(5)].g.custom)return {view:"edit",id:h.slice(5)};
  if(LESSON[h])return {view:"lesson",id:h};
  if(findGradeOrBook(h))return {view:"grade",id:h};
  if(findUnit(h))return {view:"unit",id:h};
  return {view:"home"};
}

/* ---------- lesson ---------- */
function hasSolution(s){return !!(s.solutionImage||(s.items||[]).some(i=>i.answer||i.answerImage));}
function secTextHTML(s,showAns){
  let h="";
  if(s.prompt)h+=`<div class="prompt">${math(s.prompt)}</div>`;
  if(s.note)h+=`<div class="note">${math(s.note)}</div>`;
  const items=s.items||[];
  if(items.length){
    const uniq=!(items.length===1&&items[0].text===s.prompt);
    h+=`<ul class="items">${items.map(i=>`<li>${i.label?`<span class="lbl">${esc(i.label)}</span>`:""}<span>${uniq?math(i.text):""}${showAns&&i.answer?` <span class="ans">${math(i.answer)}</span>`:""}</span></li>`).join("")}</ul>`;
  }
  return h||'<div class="sub">هذا الجزء متوفر كصفحة من الكتاب فقط.</div>';
}
function imgTag(src,imgs,cls="page-img"){const d=imgs&&imgs[src];return d?`<img class="${cls}" src="${d}" alt="صفحة من الكتاب" data-zoom>`:"";}
function secBodyHTML(s,imgs,mode,showSol){
  let h="";
  const useBook=mode==="book"&&s.image&&imgs&&imgs[s.image];
  if(useBook)h+=imgTag(s.image,imgs);else h+=`<div class="book">${secTextHTML(s,false)}</div>`;
  if(showSol){
    let sol="";
    if(useBook&&s.solutionImage&&imgs[s.solutionImage])sol=imgTag(s.solutionImage,imgs);
    else if((s.items||[]).some(i=>i.answer))sol=`<div class="book">${secTextHTML(s,true)}</div>`;
    else if(s.solutionImage&&imgs&&imgs[s.solutionImage])sol=imgTag(s.solutionImage,imgs);
    h+=`<div class="sol"><div class="sol-label">الحل</div>${sol}</div>`;
  }
  return h;
}

function parseItems(txt){
  return txt.split("\n").map(x=>x.trim()).filter(Boolean).map(line=>{
    let label="",text=line,answer="";
    const m=line.match(/^([ء-يـ]{1,3}|[0-9٠-٩]{1,2})\s*[)\-–.]\s*(.*)$/);if(m){label=m[1];text=m[2];}
    let i=-1,dep=0;for(let k=0;k<text.length;k++){if(text.startsWith("[[",k)){dep++;k++;}else if(text.startsWith("]]",k)){dep=Math.max(0,dep-1);k++;}else if(text[k]==="|"&&!dep){i=k;break;}}
    if(i>=0){answer=text.slice(i+1).trim();text=text.slice(0,i).trim();}
    return {label,text,answer};
  });
}

/* ---------- PDF cropper ---------- */
const PDFDOC={};
async function getPdf(b){
  if(PDFDOC[b.id])return PDFDOC[b.id];
  const blob=await idb.get("pdfs",b.id);if(!blob)return null;
  await loadScript(LIB.pdfWorker);await loadScript(LIB.pdf);
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIB.pdfWorker;
  PDFDOC[b.id]=lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  return PDFDOC[b.id].catch(e=>{delete PDFDOC[b.id];throw e;});
}
async function openCropper(b,onDone){
  let doc;
  try{doc=await getPdf(b);}catch(e){toast("تعذّر فتح ملف PDF. تأكد أن الملف سليم.");return;}
  if(!doc){
    const d=dialog("أرفق ملف PDF للكتاب",`<p>لقص صفحات الأجزاء، أرفق ملف الكتاب مرة واحدة ويبقى محفوظًا في هذا المتصفح. أو استخدم «رفع صورة» لصورة من الجوال.</p>`,()=>{attachPdf(b).then(ok=>ok&&openCropper(b,onDone));});
    $("[type=submit]",d).textContent="اختيار ملف PDF";return;
  }
  let page=Math.min(b.lastPage||1,doc.numPages),zoom=1,sel=null,task=null,selecting=true;
  const c=el(`<div class="crop" role="dialog" aria-label="قص من الكتاب">
    <div class="crop-top"><button class="icon-btn" id="cx" title="إغلاق">${ICON.close}</button>
      <button class="icon-btn" id="pp" title="الصفحة السابقة">${ICON.prev}</button>
      <label class="sub" for="pg">صفحة</label><input class="field" id="pg" type="number" min="1" max="${doc.numPages}" style="width:80px" value="${page}"><span class="sub">من ${H(doc.numPages)}</span>
      <button class="icon-btn" id="pn" title="الصفحة التالية">${ICON.next}</button>
      <button class="icon-btn" id="zo" title="تصغير">−</button><button class="icon-btn" id="zi" title="تكبير">+</button>
      <div class="seg" role="group" aria-label="وضع اللمس"><button id="mSel" aria-pressed="true">تحديد</button><button id="mPan" aria-pressed="false">تحريك</button></div>
      <span class="spacer"></span><button class="btn" id="whole">الصفحة كاملة</button><button class="btn gold" id="cut" disabled>قص التحديد</button></div>
    <div class="crop-hint">اسحب بإصبعك أو بالفأرة لتحديد الجزء المطلوب من الصفحة، ثم اضغط «قص التحديد».</div>
    <div class="crop-stage" id="cs"><div class="crop-page select" id="cp"><canvas id="cc"></canvas><div class="crop-sel" id="csel" hidden></div></div></div></div>`);
  layerEl().append(c);
  const cv=$("#cc",c),pg=$("#cp",c),selEl=$("#csel",c),stage=$("#cs",c);
  const close=()=>{c.remove();removeEventListener("keydown",key);};
  async function show(){
    $("#pg",c).value=page;b.lastPage=page;sel=null;selEl.hidden=true;$("#cut",c).disabled=true;
    const p=await doc.getPage(page);const v1=p.getViewport({scale:1});
    const cssW=Math.min(stage.clientWidth-32,900)*zoom;const scale=cssW/v1.width;const dens=Math.max(2,devicePixelRatio||1);
    const vp=p.getViewport({scale:scale*dens});
    if(task)try{task.cancel();}catch(e){}
    cv.width=vp.width;cv.height=vp.height;pg.style.width=cssW+"px";pg.style.height=(v1.height*scale)+"px";
    task=p.render({canvasContext:cv.getContext("2d"),viewport:vp});
    try{await task.promise;}catch(e){}
  }
  const pos=e=>{const r=pg.getBoundingClientRect();return [Math.max(0,Math.min(r.width,e.clientX-r.left)),Math.max(0,Math.min(r.height,e.clientY-r.top))];};
  let start=null;
  pg.addEventListener("pointerdown",e=>{if(!selecting)return;pg.setPointerCapture(e.pointerId);start=pos(e);sel=null;});
  pg.addEventListener("pointermove",e=>{if(!start)return;const [x,y]=pos(e);sel={x:Math.min(x,start[0]),y:Math.min(y,start[1]),w:Math.abs(x-start[0]),h:Math.abs(y-start[1])};Object.assign(selEl.style,{left:sel.x+"px",top:sel.y+"px",width:sel.w+"px",height:sel.h+"px"});selEl.hidden=false;});
  pg.addEventListener("pointerup",()=>{start=null;$("#cut",c).disabled=!(sel&&sel.w>8&&sel.h>8);});
  function crop(r){
    const k=cv.width/pg.clientWidth;const sx=r.x*k,sy=r.y*k,sw=r.w*k,sh=r.h*k;
    const s=Math.min(1,1500/sw),o=document.createElement("canvas");o.width=Math.round(sw*s);o.height=Math.round(sh*s);
    const x=o.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,o.width,o.height);x.drawImage(cv,sx,sy,sw,sh,0,0,o.width,o.height);
    saveBook(b);close();onDone(canvasToData(o),page);
  }
  $("#cut",c).onclick=()=>sel&&crop(sel);
  $("#whole",c).onclick=()=>crop({x:0,y:0,w:pg.clientWidth,h:pg.clientHeight});
  $("#cx",c).onclick=close;
  $("#pp",c).onclick=()=>{if(page>1){page--;show();}};$("#pn",c).onclick=()=>{if(page<doc.numPages){page++;show();}};
  $("#pg",c).onchange=e=>{const n=Math.max(1,Math.min(doc.numPages,parseInt(e.target.value)||1));page=n;show();};
  $("#zi",c).onclick=()=>{zoom=Math.min(3,zoom+.25);show();};$("#zo",c).onclick=()=>{zoom=Math.max(.5,zoom-.25);show();};
  const setMode=v=>{selecting=v;pg.classList.toggle("select",v);$("#mSel",c).setAttribute("aria-pressed",v);$("#mPan",c).setAttribute("aria-pressed",!v);};
  $("#mSel",c).onclick=()=>setMode(true);$("#mPan",c).onclick=()=>setMode(false);
  function key(e){if(e.target.closest("input"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")$("#pn",c).click();else if(e.key==="ArrowRight")$("#pp",c).click();}
  addEventListener("keydown",key);
  show();
}

const AR=/[ء-ي]/;
function guessNameCol(rows){
  let best=0,bestScore=-1;const w=Math.max(0,...rows.map(r=>r.length));
  for(let c=0;c<w;c++){let sc=0;for(const r of rows){const v=String(r[c]??"").trim();if(AR.test(v)&&v.split(/\s+/).length>=2&&!/اسم/.test(v))sc++;}
    for(const r of rows.slice(0,15))if(/اسم/.test(String(r[c]??"")))sc+=5;
    if(sc>bestScore){bestScore=sc;best=c;}}
  return best;
}
const colName=i=>{let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};

async function downloadTemplate(){

/* ---------- semester plan (توزيع المنهج) ---------- */
const DAYMS=864e5;
const pd=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d);};
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fd=s=>{const d=pd(s);return H(d.getDate())+"/"+H(d.getMonth()+1);};
const todayS=()=>ds(new Date());
const ORDW=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون"];
const weekName=i=>"الأسبوع "+(ORDW[i]||H(i+1));
const periodsTxt=n=>n==1?"حصة":n==2?"حصتان":H(n)+" حصص";
const clone=o=>JSON.parse(JSON.stringify(o));
function allPlans(){
  const out=[];const seen=new Set();
  for(const p of (DATA&&DATA.plans)||[]){const o=S.plans[p.id];out.push(o?Object.assign(o,{official:true,edited:true}):p);seen.add(p.id);}
  for(const id in S.plans)if(!seen.has(id))out.push(S.plans[id]);
  return out.filter(p=>findGradeOrBook(p.gradeId));
}
function getPlan(id){return allPlans().find(p=>p.id===id);}
function planFor(gid){const ps=allPlans().filter(p=>p.gradeId===gid);return ps.find(p=>!p.official)||ps[0];}
function curWeek(p){
  const t=todayS();
  if(!p.weeks.length)return {i:-1};
  if(t<p.weeks[0].from)return {i:0,upcoming:true};
  for(let i=0;i<p.weeks.length;i++){if(t<=p.weeks[i].to)return {i,upcoming:t<p.weeks[i].from};}
  return {i:p.weeks.length-1,ended:true};
}
function planStatus(p){
  const cw=curWeek(p);const past=[],ahead=[];const seen=new Set();
  p.weeks.forEach((w,i)=>w.items.forEach(it=>{
    if(!it.lessonId||!LESSON[it.lessonId]||seen.has(it.lessonId+(i<cw.i?"p":"f")))return;
    const lastWeekOfLesson=p.weeks.reduce((a,ww,j)=>ww.items.some(x=>x.lessonId===it.lessonId)?j:a,-1);
    if(lastWeekOfLesson!==i)return;
    seen.add(it.lessonId+(i<cw.i?"p":"f"));
    if(i<cw.i||cw.ended)past.push(it.lessonId);else if(S.done[it.lessonId])ahead.push(it.lessonId);
  }));
  const behind=past.filter(id=>!S.done[id]);
  return {cw,past,behind,ahead,doneP:past.length-behind.length};
}
function itemLabel(it){const r=it.lessonId&&LESSON[it.lessonId];return r?{code:r.l.code,title:r.l.title}:{code:"",title:it.label||"—"};}
function statusPill(st){
  if(st.behind.length)return `<span class="kind" style="background:#c2410c">متأخر ${H(st.behind.length)} ${st.behind.length<=2?"درس":"دروس"}</span>`;
  if(st.ahead.length)return `<span class="kind" style="background:var(--good)">متقدم ${H(st.ahead.length)}</span>`;
  return `<span class="kind" style="background:var(--accent)">على الخطة</span>`;
}

let audioCtx=null;
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=audioCtx.createOscillator(),gn=audioCtx.createGain();o.frequency.value=880;o.connect(gn);gn.connect(audioCtx.destination);gn.gain.setValueAtTime(.25,audioCtx.currentTime+t);gn.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+t+.3);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.3);});}catch(e){}}
function fmt(sec){const m=Math.floor(Math.abs(sec)/60),s=Math.abs(sec)%60;return H(m)+":"+H(String(s).padStart(2,"0"));}
class Timer{
  constructor(onTick){this.total=180;this.left=180;this.run=false;this.onTick=onTick;this.h=null;}
  set(sec){this.stop();this.total=this.left=sec;this.onTick(this);}
  start(){if(this.run)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}this.run=true;this.end=Date.now()+this.left*1000;this.h=setInterval(()=>this.tick(),250);this.onTick(this);}
  stop(){this.run=false;clearInterval(this.h);this.onTick(this);}
  reset(){this.set(this.total);}
  tick(){const l=Math.round((this.end-Date.now())/1000);if(l!==this.left){if(this.left>0&&l<=0)beep();this.left=l;this.onTick(this);}}
}

let board=null;
class Board{
  constructor(canvas,opt={}){
    this.c=canvas;this.ctx=canvas.getContext("2d");this.strokes=opt.strokes||[];this.color=opt.color||"#d23c3c";this.size=4;this.tool="pen";this.bg=opt.bg||"none";this.cur=null;

    canvas.addEventListener("pointerdown",this.down=e=>{canvas.setPointerCapture(e.pointerId);const p=this.pt(e);this.cur={c:this.color,s:this.tool==="eraser"?this.size*6:this.tool==="hl"?this.size*4:this.size,t:this.tool,p:[p]};this.strokes.push(this.cur);this.draw();});
    canvas.addEventListener("pointermove",this.move=e=>{if(!this.cur)return;this.cur.p.push(this.pt(e));this.draw();});
    const up=()=>{this.cur=null;};canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
    this.fit();
  }
  pt(e){const r=this.c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
  fit(){const r=this.c.getBoundingClientRect(),d=devicePixelRatio||1;this.w=r.width;this.h=r.height;this.c.width=Math.max(1,r.width*d);this.c.height=Math.max(1,r.height*d);this.ctx.setTransform(d,0,0,d,0,0);this.draw();}
  undo(){this.strokes.pop();this.draw();}
  clear(){this.strokes.length=0;this.draw();}
  destroy(){this.ro.disconnect();}
  background(){
    const x=this.ctx,w=this.w,h=this.h;
    if(this.bg==="none"){x.clearRect(0,0,w,h);return;}
    x.fillStyle=this.bg==="chalk"?"#1f3a33":"#ffffff";x.fillRect(0,0,w,h);
    if(this.bg==="grid"||this.bg==="axes"){
      const g=34;x.strokeStyle="#dbe3f0";x.lineWidth=1;
      const cx=Math.round(w/2/g)*g,cy=Math.round(h/2/g)*g;
      for(let X=cx%g;X<w;X+=g){x.beginPath();x.moveTo(X+.5,0);x.lineTo(X+.5,h);x.stroke();}
      for(let Y=cy%g;Y<h;Y+=g){x.beginPath();x.moveTo(0,Y+.5);x.lineTo(w,Y+.5);x.stroke();}
      if(this.bg==="axes"){
        x.strokeStyle="#16243f";x.lineWidth=2;x.beginPath();x.moveTo(0,cy+.5);x.lineTo(w,cy+.5);x.moveTo(cx+.5,0);x.lineTo(cx+.5,h);x.stroke();
        x.fillStyle="#16243f";x.font="13px IBM Plex Sans Arabic, sans-serif";x.textAlign="center";x.textBaseline="top";
        for(let X=cx%g;X<w;X+=g){const n=Math.round((X-cx)/g);if(n){x.fillText((n<0?"−":"")+H(Math.abs(n)),X,cy+5);}}
        x.textAlign="right";x.textBaseline="middle";
        for(let Y=cy%g;Y<h;Y+=g){const n=Math.round((cy-Y)/g);if(n){x.fillText((n<0?"−":"")+H(Math.abs(n)),cx-6,Y);}}
        x.font="bold 16px IBM Plex Sans Arabic, sans-serif";x.textAlign="center";x.fillText("س",w-16,cy-14);x.textAlign="center";x.fillText("ص",cx+16,12);
      }
    }
  }
  draw(){
    const x=this.ctx;this.background();
    for(const s of this.strokes){
      x.save();
      if(s.t==="eraser"){if(this.bg==="none"){x.globalCompositeOperation="destination-out";x.strokeStyle="#000";}else{x.strokeStyle=this.bg==="chalk"?"#1f3a33":"#ffffff";}}

      x.stroke();x.restore();
    }
  }
}

  if(!S.classes.length)cl.innerHTML='<div class="loading">أضف صفًا ثم الصق أسماء طلابه.</div>';
  S.classes.forEach(c=>{
    const g=DATA&&DATA.grades.find(x=>x.id===c.gradeId);
    const card=el(`<div class="class-card"><div class="class-head"><h3>${esc(c.name)}</h3><span class="sub">${g?esc(g.name)+"، ":""}${H(c.students.length)} طالبًا</span>${S.activeClass===c.id?'<span class="done-pill">الصف الحالي</span>':""}<span class="spacer"></span>
      <button class="btn small primary" data-a="pick">${ICON.dice}قرعة</button><button class="btn small" data-a="add">+ طلاب</button><button class="btn small" data-a="active">اجعله الحالي</button><button class="btn small" data-a="reset">تصفير النجوم</button><button class="btn small ghost" data-a="del">حذف الصف</button></div>
      <div class="students">${c.students.map((s,k)=>`<div class="stu"><span class="n">${esc(s.name)}</span><span class="stars">${s.stars?"★"+H(s.stars):""}</span><button class="mini" data-star="${k}" aria-label="نجمة">+★</button><button class="mini" data-del="${k}" aria-label="حذف الطالب">✕</button></div>`).join("")||'<span class="sub">لا يوجد طلاب بعد.</span>'}</div></div>`);
    card.onclick=e=>{
      const b=e.target.closest("button");if(!b)return;
      if(b.dataset.star!=null){const s=c.students[+b.dataset.star];s.stars=(s.stars||0)+1;save();viewClasses(m);return;}
      if(b.dataset.del!=null){c.students.splice(+b.dataset.del,1);save();viewClasses(m);return;}
      const a=b.dataset.a;
      if(a==="pick")openPicker(c);
      if(a==="active"){S.activeClass=c.id;save();viewClasses(m);}
      if(a==="reset"){c.students.forEach(s=>s.stars=0);save();viewClasses(m);}
      if(a==="add")dialog("إضافة طلاب إلى "+c.name,`<label for="names">اكتب أو الصق الأسماء، كل اسم في سطر</label><textarea class="field" id="names" name="names"></textarea>`,f=>{const ns=f.names.value.split(/\n|،|,/).map(x=>x.trim()).filter(Boolean);c.students.push(...ns.map(name=>({name,stars:0})));save();viewClasses(m);});
      if(a==="del"){const d=dialog("حذف "+c.name+"؟",`<p>سيُحذف الصف وأسماء طلابه ونجومهم من هذا الجهاز.</p>`,()=>{S.classes=S.classes.filter(x=>x!==c);save();viewClasses(m);});$("[type=submit]",d).textContent="حذف";}
    };
    cl.append(card);
  });
  $("#addc").onclick=()=>dialog("صف جديد",`<label for="cn">اسم الصف</label><input class="field" id="cn" name="cn" placeholder="مثال: التاسع / ٣" required>
    <label for="cg">المرحلة</label><select class="field" id="cg" name="cg">${(DATA?DATA.grades:[]).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select>
    <label for="cs">أسماء الطلاب (اختياري، كل اسم في سطر)</label><textarea class="field" id="cs" name="cs"></textarea>`,f=>{
      const name=f.cn.value.trim();if(!name)return false;
      const c={id:"c"+Date.now(),gradeId:f.cg.value,name,students:f.cs.value.split("\n").map(x=>x.trim()).filter(Boolean).map(n=>({name:n,stars:0}))};
      S.classes.push(c);if(!S.activeClass)S.activeClass=c.id;save();viewClasses(m);});
}

/* ---------- board view ---------- */
function viewBoard(m){
  m.innerHTML=`<div class="board-wrap"><div class="board-bar" id="bb">${penToolsHTML(["#16243f","#d23c3c","#2159c4","#1f8a4c","#c99a35","#ffffff"])}
    <span class="spacer"></span><label for="bgs" class="sub">الخلفية</label><select class="field" id="bgs" style="width:auto"><option value="plain">بيضاء</option><option value="chalk">خضراء</option><option value="grid">مربعات</option><option value="axes">مستوى إحداثي</option></select>
    <label for="sz" class="sub">السُمك</label><input type="range" id="sz" min="2" max="14" value="4"></div>
    <div class="board-area"><canvas id="bc" aria-label="السبورة"></canvas></div></div>`;
  m.style.overflow="hidden";
  const bg=store.get("boardBg","plain");$("#bgs").value=bg;
  board=new Board($("#bc"),{bg,color:"#16243f",strokes:Board.saved||(Board.saved=[])});
  bindPenTools($("#bb"),()=>board);
  $("#bgs").onchange=e=>{board.bg=e.target.value;store.set("boardBg",board.bg);board.draw();};
  $("#sz").oninput=e=>board.size=+e.target.value;
}
const _render=render;render=function(){$("#main").style.overflow="";_render();};

/* ---------- timer view ---------- */
let bigTimer=null;
function viewTools(m){
  m.innerHTML=`<div class="wrap" style="max-width:900px"><div class="title">المؤقت</div><div class="sub">للأنشطة الصفية مثل دورك الآن والتمارين الذاتية. يصدر صوت تنبيه عند انتهاء الوقت.</div>
    <div class="class-card" style="margin-top:16px"><div class="big-clock" id="bc" aria-live="off"></div>
    <div class="presets">${[1,2,3,5,10,15].map(n=>`<button class="btn" data-min="${n}">${H(n)} ${n<=2?(n===1?"دقيقة":"دقيقتان"):n<=10?"دقائق":"دقيقة"}</button>`).join("")}</div>
    <div class="dlg-actions" style="justify-content:center"><button class="btn primary" id="go">ابدأ</button><button class="btn" id="rs">إعادة</button></div></div></div>`;
  if(!bigTimer)bigTimer=new Timer(()=>{});
  bigTimer.onTick=t=>{const c=$("#bc");if(!c)return;c.textContent=fmt(Math.max(0,t.left));c.style.color=t.left<=0?"#d23c3c":t.left<=10?"#d23c3c":"";$("#go").textContent=t.run?"إيقاف":"ابدأ";};
  bigTimer.onTick(bigTimer);
  m.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>bigTimer.set(+b.dataset.min*60));
  $("#go").onclick=()=>{if(bigTimer.run)bigTimer.stop();else{if(bigTimer.left<=0)bigTimer.reset();bigTimer.start();}};
  $("#rs").onclick=()=>bigTimer.reset();
}

/* ---------- settings ---------- */
function viewSettings(m){
  m.innerHTML=`<div class="wrap" style="max-width:820px"><div class="title">الإعدادات</div>
   <div class="class-card" style="margin-top:16px"><h3>المظهر</h3><div class="seg" style="margin-top:10px" role="group" aria-label="المظهر">${[["auto","تلقائي"],["light","فاتح"],["dark","داكن"]].map(([k,t])=>`<button data-th="${k}" aria-pressed="${S.theme===k}">${t}</button>`).join("")}</div></div>
   <div class="class-card" style="margin-top:14px"><h3>النسخ الاحتياطي</h3><p class="sub">الصفوف والنجوم والدروس المشروحة محفوظة في هذا المتصفح فقط. الكتب التي تضيفها تُنقل بزر «تصدير الكتاب» في صفحة كل كتاب. انسخ النسخة الاحتياطية واحفظها في الملاحظات أو أرسلها لنفسك، ثم الصقها هنا على جهاز آخر.</p>
    <textarea class="field" id="bk" aria-label="النسخة الاحتياطية" style="font-family:monospace;font-size:13px;direction:ltr;text-align:left"></textarea>
    <div class="dlg-actions"><button class="btn primary dl-only" id="dlb">تنزيل ملف النسخة الاحتياطية</button><button class="btn" id="cp">نسخ النص</button><button class="btn" id="rst">استعادة من النص الملصق</button><label class="btn" for="fi">استعادة من ملف</label><input type="file" id="fi" accept=".json,.txt" hidden></div></div>
   <div class="class-card" style="margin-top:14px"><h3>اختصارات العرض</h3><p class="sub" style="margin:6px 0 0">← أو المسافة: الجزء التالي، →: الجزء السابق، S: إظهار الحل، Esc: إنهاء العرض</p></div></div>`;
  m.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();viewSettings(m);});
  const dump=()=>JSON.stringify({app:"hessati",v:1,classes:S.classes,done:S.done,activeClass:S.activeClass,plans:S.plans});
  $("#bk").value=dump();
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(dump());toast("تم النسخ");}catch(e){$("#bk").select();toast("حدّد النص وانسخه يدويًا");}};
  const restore=txt=>{try{const o=JSON.parse(txt);if(o.app!=="hessati"||!Array.isArray(o.classes))throw 0;S.classes=o.classes;S.done=o.done||{};S.activeClass=o.activeClass;if(o.plans)S.plans=o.plans;save();toast("تمت الاستعادة");viewSettings(m);}catch(e){toast("النص ليس نسخة احتياطية صالحة من حصتي.");}};
  $("#rst").onclick=()=>restore($("#bk").value);
  $("#dlb").onclick=()=>saveFile("حصتي نسخة احتياطية.json",dump());
  $("#fi").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(restore);};
}

/* ---------- start ---------- */
route=fromHash();render();
Promise.all([loadData(),loadBooks()]).then(()=>{route=fromHash();render();}).catch(e=>{$("#main").innerHTML=`<div class="wrap"><div class="loading">تعذّر تحميل ملف الدروس. أعد تحميل الصفحة. (${esc(e.message)})</div></div>`;});
/* offline support for the web version (not needed inside the native app) */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)&&!window.Capacitor){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
